name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]  # 3.10 = typical shared hosting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Shared hosting usually means MySQL/MariaDB and an older Python
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: skyhop
          MARIADB_USER: skyhop
          MARIADB_PASSWORD: skyhop
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Smoke test on MariaDB
        env:
          DATABASE_URL: mysql://skyhop:skyhop@127.0.0.1:3306/skyhop
        run: |
          flask --app wsgi init-db
          python scripts/smoke.py

  # Runs deploy/shared-hosting/install.sh + update.sh the way a user would on cPanel/Plesk
  install-script:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: skyhop
          MARIADB_USER: skyhop
          MARIADB_PASSWORD: "p@ss:w/rd"
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install.sh (first run creates .env, second run installs)
        run: |
          python -m venv ~/virtualenv/skyhop
          source ~/virtualenv/skyhop/bin/activate
          bash deploy/shared-hosting/install.sh
          grep -q '^SKYHOP_ENV=production' .env
          sed -i 's#^BASE_URL=.*#BASE_URL=https://skyhop.example.at#' .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=mysql://skyhop:p%40ss%3Aw%2Frd@127.0.0.1:3306/skyhop#' .env
          SKIP_ADMIN=1 bash deploy/shared-hosting/install.sh
          flask --app wsgi create-admin --email ci@skyhop.test --first-name CI --last-name Bot --password ci-password-123456
          test -f tmp/restart.txt
          SKIP_PULL=1 bash deploy/shared-hosting/update.sh  # the CI checkout is a detached HEAD
      - name: Serve passenger_wsgi like Passenger does
        run: |
          source ~/virtualenv/skyhop/bin/activate
          gunicorn passenger_wsgi:application --bind 127.0.0.1:8000 --daemon
          sleep 3
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/ | grep -q "Mitflugbörse"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/dev/mails)" = 404
          flask --app wsgi cron

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skyhop
          POSTGRES_USER: skyhop
          POSTGRES_PASSWORD: skyhop
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U skyhop" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-postgres.txt
      - name: Smoke test on PostgreSQL
        env:
          DATABASE_URL: postgres://skyhop:skyhop@127.0.0.1:5432/skyhop
        run: |
          flask --app wsgi init-db
          python scripts/smoke.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^SKYHOP_SECRET_KEY=.*/SKYHOP_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-test-password/" .env
          sed -i "s#^BASE_URL=.*#BASE_URL=http://localhost#" .env
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check through Caddy
        run: |
          curl -fsS http://localhost/healthz
          curl -fsS http://localhost/ | grep -q "Mitflugbörse"
          curl -fsSI http://localhost/ | grep -qi "x-frame-options: DENY"
      - name: Admin + cron inside the container
        run: |
          docker compose exec -T app flask --app wsgi create-admin --email ci@skyhop.test \
            --first-name CI --last-name Bot --password ci-password-123456
          docker compose exec -T app flask --app wsgi cron
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail=100
