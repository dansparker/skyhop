# Skyhop auf einem eigenen Server (VPS) mit Docker:
#   cp .env.example .env   # ausfüllen: DOMAIN, POSTGRES_PASSWORD, SKYHOP_SECRET_KEY, BASE_URL, MAIL_* …
#   docker compose up -d --build
#   docker compose exec app flask --app wsgi create-admin
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skyhop
      POSTGRES_USER: skyhop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyhop -d skyhop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app: &app
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://skyhop:${POSTGRES_PASSWORD}@db:5432/skyhop
      SKYHOP_ENV: production
      TRUST_PROXY: "1"
    volumes:
      - uploads:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy

  cron:
    <<: *app
    # Periodic jobs (payouts, document cleanup) once per hour
    entrypoint: ["sh", "-c", "while true; do flask --app wsgi cron; sleep 3600; done"]
    command: []
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
