{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Neues Passwort – Skyhop{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form method="post" class="auth-card">
    {{ csrf() }}
    <h1>Neues Passwort festlegen</h1>
    <label class="field"><span>Neues Passwort</span><input type="password" name="new" minlength="8" required autofocus autocomplete="new-password"></label>
    <label class="field"><span>Wiederholen</span><input type="password" name="new2" minlength="8" required autocomplete="new-password"></label>
    <button class="btn btn-primary btn-block btn-lg" type="submit">Passwort speichern</button>
  </form>
</div>
{% endblock %}
