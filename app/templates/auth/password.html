{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Passwort ändern – Skyhop{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form method="post" class="auth-card">
    {{ csrf() }}
    <h1>Passwort ändern</h1>
    <label class="field"><span>Aktuelles Passwort</span><input type="password" name="current" required autocomplete="current-password"></label>
    <label class="field"><span>Neues Passwort</span><input type="password" name="new" minlength="8" required autocomplete="new-password"></label>
    <label class="field"><span>Neues Passwort wiederholen</span><input type="password" name="new2" minlength="8" required autocomplete="new-password"></label>
    <button class="btn btn-primary btn-block" type="submit">Speichern</button>
  </form>
</div>
{% endblock %}
